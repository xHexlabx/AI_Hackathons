[project]
name = "ai-hackathons"
version = "2026.9.0"
description = "HexTex's Kaggle competitions & AI hackathon workspace - Python-first."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "xgboost>=2.1",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "rich>=13.0",
  "kaggle>=1.7",
]

[dependency-groups]
# `uv sync` installs `dev` + `sim` by default (see tool.uv.default-groups).
dev = ["ruff>=0.13", "pytest>=8.3", "pre-commit>=4.0"]
# Simulation competitions (Kaggriculture, Lux AI, ...)
sim = ["kaggle-environments>=1.32"]
# Notebook tooling for EDA
nb = ["jupyterlab>=4.2", "ipykernel>=6.29", "ipywidgets>=8.1"]
# Deep learning - heavy; usually run on Colab / Kaggle GPU instead: `uv sync --group dl`
dl = [
  "torch>=2.4",
  "torchvision>=0.19",
  "timm>=1.0",
  "transformers>=4.44",
  "albumentations>=1.4",
  "lightning>=2.4",
]

[tool.uv]
default-groups = ["dev", "sim"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb", "templates/**/*.py.tmpl", "**/agents/reference/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]

[tool.ruff.lint.per-file-ignores]
# simulation tooling prints wide tables; agents are single-file submissions
"**/sim/*.py" = ["E501"]
"**/agents/*.py" = ["E501", "SIM113", "SIM114"]
"**/main.py" = ["E501", "SIM113", "SIM114"]

[tool.ruff.lint.isort]
known-first-party = ["common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
